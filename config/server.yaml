# Server configuration.
#
# Top-level keys are profiles. `default` always applies; select another profile on top of it
# with `--profile <name>` or LASER_PROFILE=<name>. Every key is optional: anything left out keeps
# its built-in default. Environment variables override everything, e.g.
#   LASER_NETWORK__PORT=6001  LASER_PROJECTOR__DAC__ENABLED=false
#
# Sections are read by the plugins that own them:
#   runtime             RuntimeSettings          (server-core)
#   network             NetworkingConfiguration  (server-core network plugin)
#   projector           ProjectorConfiguration   (common)
#   projector.optimize  LaserOptimizeConfig      (server-core projector plugin)
#   projector.dac       DacSettings              (server-core projector plugin)
#   camera              CameraConfiguration      (common)
#   scene               SceneConfiguration       (common)
#   vision              PhysicalCameraSettings   (server-core vision plugin)
#   vision.calibration  CameraCalibrationSettings (server-core camera calibration plugin)
#   audio               AudioConfiguration       (server-core audio plugin)

default:
  runtime:
    tick_hz: 29.296875        # 30000 PPS / 1024 points
    fixed_hz: 50
    log_level: info
    assets_dir: assets          # pipelines and shapes; relative to the working dir or the executable

  network:
    ip: 0.0.0.0
    port: 6000

  projector:
    switched_on: true
    dac_pps: 30000
    dac_min_points: 1024
    angle: 60.0
    dac:
      enabled: true
      reconnect_secs: 5.0
    optimize:
      # Shapes: galvo model (metres per second on the scene, milliseconds)
      lit_speed_m_s: 10000.0      # speed along lit lines (~0.33 m per point at 30 kpps)
      max_lit_step_dac: 150.0     # cap per lit point
      corner_ramp_ms: 0.1         # slow-down/speed-up around sharp corners and stroke ends
      corner_hold_ms: 0.2         # hold at a 90 degree corner, scaled by turn angle
      stroke_start_hold_ms: 0.2   # lit hold at the start of an open stroke
      stroke_end_hold_ms: 0.2     # lit hold at the end of an open stroke (mirrors reach the end)
      blank_speed_m_s: 20000.0    # laser-off jump speed
      max_blank_step_dac: 300.0   # cap per jump point
      depart_ms: 0.5              # laser-off hold before leaving a stroke
      settle_ms: 0.5              # hold after a jump before the laser turns on ...
      settle_ms_per_m: 0.05       # ... plus this much per metre of jump
      # Shapes: diode model
      laser_on_delay_ms: 0.0      # + light on earlier (slow diode), - later (lagging mirrors)
      laser_off_delay_ms: 0.0     # + light off earlier (afterglow), - stays on longer (lagging mirrors)
      # Text pipeline only (point counts)
      start_dwell_points: 6
      end_dwell_points: 6
      blank_end_dwell: 20
      blank_start_dwell: 20
      blank_jump_steps: 24
      interp_distance_threshold: 250.0
      interp_spacing: 350.0
      corner_dwell_points: 6
      corner_angle_threshold: 135.0

  scene:
    scene_dimension: [10.0, 6.0]

  vision:
    enabled: false              # run the camera worker; what it sees drives pipelines (vision/*)
    stream_width: 640
    stream_height: 480
    stream_fps: 30
    calibration:                # camera ↔ projector calibration, started from the terminal
      grid: [3, 3]              # dots across and down the scene
      margin: 0.1               # share of the scene left free at each edge
      settle_ms: 350            # wait after moving the dot before measuring it
      measure_ms: 400           # how long each dot is measured
      dot_color: [0, 255, 0]    # must be the colour the camera detects (green)
      file: camera_calibration.json   # solved mapping, next to this file

  audio:
    enabled: true
    volume: 1.0
    spatial_panning: true

# Raspberry Pi rig
rpi:
  runtime:
    log_level: info

# Development machine without a projector attached
dev:
  projector:
    dac:
      enabled: false
