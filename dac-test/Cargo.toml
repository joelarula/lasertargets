[package]
name    = "dac-test"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dac-test"
path = "src/main.rs"

[dependencies]
libloading = "0.8"
log        = "0.4"
env_logger = "0.11"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm  = "0.28"
common     = { path = "../common" }
laserlogic = { path = "../laserlogic" }
server     = { path = "../server" }


