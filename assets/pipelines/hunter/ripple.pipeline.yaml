# Ring where a shot lands. The game writes a 5 cm circle in the hit (yellow) or miss (red)
# colour as the base; the entity is removed when the lifetime ends.
name: hunter/ripple

# self.life goes from 0 to 1 over these 100 ms.
lifetime_ms: 100

stages:
  # Size: grows from 1x to 7x (5 cm → 35 cm) over the lifetime.
  - scale: { id: grow, factor: { signal: self.life, range: [1.0, 7.0] } }
