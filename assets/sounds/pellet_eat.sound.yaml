# Snake ate a pellet: a quick rising chirp.
name: pellet_eat
description: Up-chirp 1400 → 2000 Hz, 25 ms

layers:
  # Sweep 1400 Hz up to 2000 Hz over 25 ms.
  - source: { chirp: { from_hz: 1400, to_hz: 2000, ms: 25 } }
    stages:
      # Envelope: 2 ms snap-in, 5 ms fade-out.
      - envelope: { attack_ms: 2, decay_ms: 5, sustain: 0.9, release_ms: 5 }
